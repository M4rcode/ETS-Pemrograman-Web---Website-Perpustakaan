<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="CSS/style.css">
        <link rel="stylesheet" href="CSS/table.css">
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="fw-bolder p-4" style="background-color: #ABD9FA; background-image: url('images/wrinkle.png'); background-size: 300px 200px;">
            <div class="container d-flex flex-wrap justify-content-between align-items-center">
                <div class="d-flex flex-row gap-3">
                    <img src="images/logo.png" style="width: 75px; height: auto;">
                    <h2 class="mb-0">LibraryRig</h2>
                </div>
                <nav class="d-flex align-items-center gap-3 my-2 my-lg-0">
                    <a href="index.html" class="btn btn-light me-2">Beranda</a>
                    <a href="tentang.html" class="btn btn-light me-2">Tentang</a>
                    <a href="layanan.html" class="btn btn-light me-2">Layanan</a>
                    <a href="daftar.html" class="btn btn-light me-2">Pendaftaran</a>
                    <a href="tabel.html" class="btn btn-light me-2 fw-bolder">Data Anggota</a>
                </nav>
                <div>
                    <a href="login.html" class="btn btn-warning">Login</a>
                </div>
            </div>
        </header>

        <div class="d-flex flex-column gap-4" style="margin: auto;">
            <div class="d-flex flex-row gap-3">
                <input type="text" id="spesifik" class="form-control" placeholder="Cari nama, NIM/NRP, atau program studi">
                <select id="jenis_anggota" class="form-control">
                    <option value="default">Semua Jenis</option>
                    <option value="Mahasiswa">Mahasiswa</option>
                    <option value="dosen">Dosen</option>
                    <option value="tendik">Tendik</option>
                </select>
                <select id="jenis_anggota" class="form-control">
                    <option value="default">Semua Program Studi</option>
                    <option value="Mahasiswa">Mahasiswa</option>
                    <option value="dosen">Dosen</option>
                    <option value="tendik">Tendik</option>
                </select>
            </div>

            <table class="table" style="margin: auto;">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>NIM</th>
                        <th>Nama</th>
                        <th>Program Studi</th>
                        <th>Jenis Keanggotaan</th>
                        <th>Email</th>
                        <th>Nomor Telepon</th>
                        <th>Alamat</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
        
        <footer class="bg-dark text-white py-4 mt-auto">
            <div class="container d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1">LibraryRig</h5>
                    <small>© 2024 LibraryRig. All rights reserved.</small>
                </div>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/tabel.js"></script>
    </body>
</html>
