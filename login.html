<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="CSS/style.css">
        <link rel="stylesheet" href="CSS/login.css">
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="fw-bolder p-4" style="background-color: #ABD9FA; background-image: url('images/wrinkle.png'); background-size: 300px 200px;">
            <div class="container d-flex flex-wrap justify-content-between align-items-center">
                <div class="d-flex flex-row gap-3">
                    <img src="images/logo.png" style="width: 75px; height: auto;">
                    <h2 class="mb-0">LibraryRig</h2>
                </div>
                <nav class="d-flex align-items-center gap-3 my-2 my-lg-0">
                    <a href="index.html" class="btn btn-light me-2">Beranda</a>
                    <a href="tentang.html" class="btn btn-light me-2">Tentang</a>
                    <a href="layanan.html" class="btn btn-light me-2">Layanan</a>
                    <a href="daftar.html" class="btn btn-light me-2">Pendaftaran</a>
                    <a href="tabel.html" class="btn btn-light me-2">Data Anggota</a>
                </nav>
                <div>
                    <a href="login.html" class="btn btn-warning fw-bolder">Login</a>
                </div>
            </div>
        </header>

        <div class="card-login">
            <form id="daftar" class="d-flex flex-column justify-content-center align-items-center" style="gap: 20px;" onsubmit="return validateForm(event)">
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <h3>Login Petugas</h3>
                    <p style="font-weight: bold; font-size: x-small; color: red;">(Email = petugas@gmail.com | Password = passwordPetugas123)</p>
                </div>
                <div style="width: 100%;">
                    <label>Email Petugas</label>
                    <input type="text" id="email" class="form-control" placeholder="Masukkan email">
                    <span id="email-error" style="color: red; font-size: 12px; display: block; min-height: 18px;"></span>
                </div>
                <div style="width: 100%;">
                    <label>Password</label>
                    <input type="text" id="password" class="form-control" placeholder="Masukkan password">
                    <span id="password-error" style="color: red; font-size: 12px; display: block; min-height: 18px;"></span>
                </div>
                <button type="submit" class="btn btn-dark" style="width: 100%;">Login</button>
            </form>
        </div>

        <footer class="bg-dark text-white py-4 mt-auto">
            <div class="container d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1">LibraryRig</h5>
                    <small>© 2024 LibraryRig. All rights reserved.</small>
                </div>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
