<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="CSS/style.css">
        <link rel="stylesheet" href="CSS/pendaftaran.css">
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="fw-bolder p-4" style="background-color: #ABD9FA; background-image: url('images/wrinkle.png'); background-size: 300px 200px;">
            <div class="container d-flex flex-wrap justify-content-between align-items-center">
                <div class="d-flex flex-row gap-3">
                    <img src="images/logo.png" style="width: 75px; height: auto;">
                    <h2 class="mb-0">LibraryRig</h2>
                </div>
                <nav class="d-flex align-items-center gap-3 my-2 my-lg-0">
                    <a href="index.html" class="btn btn-light me-2">Beranda</a>
                    <a href="tentang.html" class="btn btn-light me-2">Tentang</a>
                    <a href="layanan.html" class="btn btn-light me-2">Layanan</a>
                    <a href="daftar.html" class="btn btn-light me-2 fw-bolder">Pendaftaran</a>
                    <a href="tabel.html" class="btn btn-light me-2">Data Anggota</a>
                </nav>
                <div>
                    <a href="login.html" class="btn btn-warning">Login</a>
                </div>
            </div>
        </header>

        <div class="card-daftar">
            <form id="daftar" class="d-flex flex-column justify-content-center align-items-center" style="gap: 20px;" onsubmit="return validateForm(event)">
                <h3>Daftar Jadi Anggota</h3>
                <div class="d-flex align-items-center gap-2" style="width: 100%;">
                    <div class="w-100">
                        <label>Nama Lengkap</label>
                        <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap">
                        <span id="nama-error" style="color: red; font-size: 12px; display: block; min-height: 18px;"></span>
                    </div>
                    <div class="w-100">
                        <label>NIM/NRP</label>
                        <input type="text" id="nim" class="form-control" placeholder="Masukkan NIM atau NRP">
                        <span id="nim-error" style="color: red; font-size: 12px; display: block; min-height: 18px;"></span>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2" style="width: 100%;">
                    <div class="w-100">
                        <label>Program Studi</label>
                        <select id="program_studi" class="form-control" disabled>
                            <option value="-">--Pilih program studi--</option>
                        </select>
                        <span id="program-error" style="color: red; font-size: 12px; display: block; min-height: 18px;"></span>
                    </div>
                    <div class="w-100">
                        <label>Jenis Keanggotaan</label>
                        <select id="jenis_anggota" class="form-control">
                            <option value="-">--Pilih jenis keanggotaan--</option>
                            <option value="Mahasiswa">Mahasiswa</option>
                            <option value="Dosen">Dosen</option>
                            <option value="Tendik">Tendik</option>
                        </select>
                        <span id="jenis-error" style="color: red; font-size: 12px; display: block; min-height: 18px;"></span>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2" style="width: 100%;">
                    <div class="w-100">
                        <label>Nomor Telepon</label>
                        <input type="text" id="telepon" class="form-control" placeholder="08xxxxxxxxxx">
                        <span id="telepon-error" style="color: red; font-size: 12px; display: block; min-height: 18px;"></span>
                    </div>
                    <div class="w-100">
                        <label>Email</label>
                        <input type="text" id="email" class="form-control" placeholder="name@example.com">
                        <span id="email-error" style="color: red; font-size: 12px; display: block; min-height: 18px;"></span>
                    </div>
                </div>
                <div style="width: 100%;">
                    <label>Alamat</label>
                    <input type="text" id="alamat" class="form-control" placeholder="Masukkan alamat lengkap">
                    <span id="alamat-error" style="color: red; font-size: 12px; display: block; min-height: 18px;"></span>
                </div>
                <button type="submit" class="btn btn-dark" style="width: 100%;">Daftar Sekarang</button>
            </form>
        </div>

        <footer class="bg-dark text-white py-4 mt-auto">
            <div class="container d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1">LibraryRig</h5>
                    <small>© 2026 LibraryRig. All rights reserved.</small>
                </div>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/pendaftaran.js"></script>
    </body>
</html>
